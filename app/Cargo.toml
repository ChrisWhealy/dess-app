[package]
name = "dess-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The discrete-event service simulator, drawn in the browser with svg-dom-graph"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
service-sim = { path = "../crates/service-sim" }
service-sim-engine = { path = "../crates/service-sim-engine" }
svg-dom-graph = "0.2.50"
svg-dom = "^0.2.17"
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window", "Document", "Element", "Node", "NodeList", "HtmlElement", "HtmlSelectElement", "HtmlInputElement",
    "SvgElement", "Event", "EventTarget", "KeyboardEvent", "MouseEvent", "FocusEvent", "CssStyleDeclaration", "console",
]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
